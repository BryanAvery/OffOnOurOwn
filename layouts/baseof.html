<!doctype html><html lang="en-gb"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ if .IsHome }}{{ site.Title }} — A travel journal{{ else }}{{ .Title }} | {{ site.Title }}{{ end }}</title><meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">{{ if eq .Section "map" }}<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">{{ end }}<link rel="stylesheet" href="{{ "css/site.css" | relURL }}"></head><body><header class="site-header"><div class="wrap header-inner"><a class="brand" href="{{ site.Home.RelPermalink }}"><span class="brand-mark">✳</span><span>Off On Our Own<small>THE TRAVEL JOURNAL</small></span></a><button class="menu-toggle" aria-controls="primary-nav" aria-expanded="false" type="button">☰ <span>Menu</span></button><nav id="primary-nav" aria-label="Main navigation"><a href="{{ site.Home.RelPermalink }}">Home</a><a href="{{ "map/" | relURL }}">Explore the map</a><a href="{{ "destinations/" | relURL }}">Destinations</a><a href="{{ "stories/" | relURL }}">Journal</a><a href="{{ "travel/" | relURL }}">Journeys</a><a href="{{ "about/" | relURL }}">Our story</a></nav></div></header><main>{{ block "main" . }}{{ end }}</main><footer class="footer"><div class="wrap footer-inner"><div><strong>Off On Our Own</strong><p>Places, people and stories collected along the way.</p></div><div><a href="{{ "map/" | relURL }}">Travel map</a> · <a href="{{ "stories/" | relURL }}">Journal</a> · <a href="{{ "about/" | relURL }}">About</a></div></div></footer><script>const menu=document.querySelector('.menu-toggle');if(menu){menu.addEventListener('click',()=>{const expanded=menu.getAttribute('aria-expanded')==='true';menu.setAttribute('aria-expanded',String(!expanded));document.querySelector('#primary-nav').classList.toggle('is-open',!expanded)})}</script></body></html>
